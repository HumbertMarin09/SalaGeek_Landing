name: v3 CI

on:
  push:
    branches: [v3]
    paths: ['web/**', '.github/workflows/v3-ci.yml']
  pull_request:
    branches: [v3]
    paths: ['web/**', '.github/workflows/v3-ci.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: mysql://sg:sg@127.0.0.1:3306/sgv3
      CONTENT_SOURCE: fixtures
      PUBLIC_ENV: staging
      HTACCESS_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run db:guard
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
